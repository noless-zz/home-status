<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Status</title>
<style>
  :root { --text:#eef1f6; --muted:#a3adbd; --line:rgba(255,255,255,.10);
          --ok:#3ecf8e; --warn:#f5b84b; --bad:#ff5d5d; --off:#7b8496; --drift:30s; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b0e13; color:var(--text);
              font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; cursor:none; }

  /* ---- background photo: two layers crossfade, each slowly pans and zooms (Ken Burns) ---- */
  .bg { position:fixed; inset:-6%; background:center/cover no-repeat; opacity:0; z-index:0;
        transition:opacity 3.5s ease; will-change:transform, opacity, filter; }
  .bg.show { opacity:1; }
  .bg.kb { animation:kb var(--kbdur,80s) ease-in-out infinite alternate; }
  @keyframes kb { from { transform:translate(var(--x0),var(--y0)) scale(var(--s0)); }
                  to   { transform:translate(var(--x1),var(--y1)) scale(var(--s1)); } }
  #fx { position:fixed; inset:0; z-index:1; pointer-events:none; }
  .shade { position:fixed; inset:0; z-index:2; pointer-events:none; transition:opacity 2s ease;
           background:linear-gradient(180deg, rgba(6,8,12,.55) 0%, rgba(6,8,12,.25) 40%, rgba(6,8,12,.70) 100%); }
  body.amb .shade { opacity:.55; }
  #night { position:fixed; inset:0; z-index:5; pointer-events:none; background:#000; opacity:0; transition:opacity 6s ease; }
  body.night #night { opacity:.45; }
  #flash { position:fixed; inset:0; z-index:4; pointer-events:none; background:#dfe8ff; opacity:0; }

  /* ---- everything on top drifts a few pixels now and then (burn-in protection) ---- */
  #stage { position:fixed; inset:0; z-index:3; transition:transform var(--drift) linear; }
  .view { position:absolute; inset:0; transition:opacity 1.4s ease, filter 1.4s ease, transform 1.4s ease; }
  body.amb #dash, body:not(.amb) #amb { opacity:0; filter:blur(12px); transform:scale(.985); pointer-events:none; }

  /* ---- dashboard view ---- */
  #dash { padding:3vh 3vw; display:flex; flex-direction:column; gap:2.4vh; }
  header { display:flex; justify-content:space-between; align-items:flex-end; }
  .clock { font-size:min(9vw,12vh); font-weight:300; line-height:1; letter-spacing:-.02em; }
  .date { color:var(--muted); font-size:min(2.2vw,3vh); margin-top:.6vh; }
  .overall { text-align:right; }
  .overall .big { font-size:min(3.2vw,4.5vh); font-weight:600; display:flex; align-items:center; gap:.6em; justify-content:flex-end; }
  .overall .small { color:var(--muted); font-size:min(1.6vw,2.2vh); margin-top:.5vh; }
  .clock, .date, .overall, .amb-clock, .amb-date, .amb-line { text-shadow:0 2px 14px rgba(0,0,0,.65); }
  .grid { flex:1; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,21rem),1fr));
          gap:2vh 1.4vw; align-content:start; grid-auto-flow:row dense; }
  .card { position:relative; overflow:hidden; border-radius:16px; padding:2.1vh 1.5vw;
          background:rgba(18,22,30,.62); border:1px solid var(--line); border-left:6px solid var(--off);
          backdrop-filter:blur(16px) saturate(1.15); -webkit-backdrop-filter:blur(16px) saturate(1.15); }
  .card.wide { grid-column:span 2; }
  .card.ok { border-left-color:var(--ok); } .card.warn { border-left-color:var(--warn); } .card.bad { border-left-color:var(--bad); }
  .card::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:.0;
                 background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.10) 50%, transparent 60%);
                 background-size:250% 100%; animation:sheen 11s ease-in-out infinite; animation-delay:calc(var(--i,0) * 1.3s); }
  @keyframes sheen { 0%,70% { opacity:0; background-position:120% 0; } 75% { opacity:1; } 100% { opacity:0; background-position:-120% 0; } }
  .grid.enter .card { animation:rise .9s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 80ms); }
  @keyframes rise { from { opacity:0; transform:translateY(24px) scale(.97); filter:blur(6px); } to { opacity:1; transform:none; filter:none; } }
  .card h2 { margin:0; font-size:min(1.45vw,2vh); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  .main { font-size:min(2.5vw,3.5vh); font-weight:600; margin:1vh 0 1.2vh; display:flex; align-items:center; gap:.5em; }
  .rows { display:grid; grid-template-columns:auto minmax(0,1fr); gap:.5vh 1.2em; font-size:min(1.45vw,2vh); margin:0; }
  .rows dt { color:var(--muted); } .rows dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; overflow-wrap:break-word; min-width:0; }
  .main { align-items:baseline; flex-wrap:wrap; row-gap:0; } .main > .dot { align-self:center; }
  .main small { font-size:.55em; font-weight:500; color:var(--muted); white-space:nowrap; align-self:baseline; }

  /* status chips (Home Assistant parts, autostart) */
  .chips { display:flex; flex-wrap:wrap; gap:.55em; margin:0 0 1.3vh; font-size:min(1.3vw,1.8vh); }
  .chip { display:flex; align-items:center; gap:.45em; padding:.3em .8em .3em .65em; border-radius:999px;
          background:rgba(255,255,255,.06); border:1px solid var(--line); white-space:nowrap; }
  .chip .dot { width:.5em; height:.5em; }

  /* ring gauges (This PC) */
  .rings { display:flex; justify-content:space-around; gap:1vw; margin:0 0 .9vh; }
  .ring { position:relative; width:min(5.2vw,7.4vh); aspect-ratio:1; }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-width:3.4; stroke-linecap:round; transition:stroke-dasharray 1.5s ease; }
  .ring circle.track { stroke:rgba(255,255,255,.12); }
  .ring .lbl { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
               font-weight:600; font-size:min(1.35vw,1.9vh); line-height:1.05; font-variant-numeric:tabular-nums; }
  .ring .lbl small { color:var(--muted); font-weight:500; font-size:.68em; letter-spacing:.05em; }

  /* sparklines (CPU, response time over the last 10 min) */
  .spk { margin:0 0 1vh; }
  .spk-h { display:flex; justify-content:space-between; font-size:min(1.15vw,1.6vh); color:var(--muted); margin-bottom:.4vh; }
  .spk-h b { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
  .spk svg { display:block; width:100%; height:3.4vh; border-bottom:1px solid var(--line); }

  /* Jar: request path as a flow — Funnel → Server → Worker → Ollama — then details in two columns */
  .flow { display:flex; align-items:flex-start; margin:0 0 1.3vh; --ic:min(3vw,4.2vh); }
  .node { flex:1 1 0; display:flex; flex-direction:column; align-items:center; text-align:center; gap:.45vh; min-width:0; }
  .node .ic { width:var(--ic); aspect-ratio:1; border-radius:28%; display:grid; place-items:center; color:var(--off);
              background:rgba(255,255,255,.05); border:1.5px solid var(--off); }
  .node.ok .ic { color:var(--ok); border-color:var(--ok); background:rgba(62,207,142,.12); box-shadow:0 0 14px rgba(62,207,142,.25); }
  .node.bad .ic { color:var(--bad); border-color:var(--bad); background:rgba(255,93,93,.14); animation:pulse 1.2s infinite; }
  .node .ic svg { width:56%; height:56%; }
  .node b { font-size:min(1.3vw,1.8vh); font-weight:600; margin-top:.3vh; }
  .node span { font-size:min(1.15vw,1.6vh); color:var(--muted); line-height:1.25; overflow-wrap:break-word; max-width:100%; }
  .arrow { flex:0 1 4vw; min-width:1.2vw; height:2px; margin-top:calc(var(--ic) / 2 - 1px); position:relative;
           background:linear-gradient(90deg, rgba(255,255,255,.12), rgba(255,255,255,.35)); }
  .arrow::before { content:""; position:absolute; right:-1px; top:-4px; border:5px solid transparent; border-left:6px solid rgba(255,255,255,.35); border-right:0; }
  .arrow::after { content:""; position:absolute; top:-2px; left:0; width:6px; height:6px; border-radius:50%; background:var(--ok);
                  box-shadow:0 0 8px var(--ok); animation:flow 2.6s linear infinite; animation-delay:var(--d,0s); }
  .arrow.off::after { display:none; }
  @keyframes flow { 0% { left:0; opacity:0; } 15% { opacity:1; } 85% { opacity:1; } 100% { left:calc(100% - 6px); opacity:0; } }
  .jar { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,8.5rem),1fr)); gap:1.2vh 1.6vw;
         border-top:1px solid var(--line); padding-top:1.1vh; }
  .stat { min-width:0; }
  .stat .k { display:flex; align-items:center; gap:.45em; color:var(--muted); font-size:min(1.1vw,1.55vh); letter-spacing:.04em; margin-bottom:.4vh; }
  .stat .k .dot { width:.5em; height:.5em; }
  .stat .v { font-size:min(1.35vw,1.9vh); line-height:1.3; overflow-wrap:break-word; }
  .stat .v small { color:var(--muted); font-size:.85em; }
  .evbar { margin-top:.7vh; }
  .dot { width:.6em; height:.6em; border-radius:50%; background:var(--off); flex:none; }
  .ok .main .dot, .dot.ok { background:var(--ok); box-shadow:0 0 12px var(--ok); animation:breathe 4s ease-in-out infinite; }
  .warn .main .dot, .dot.warn { background:var(--warn); box-shadow:0 0 12px var(--warn); }
  .bad .main .dot, .dot.bad { background:var(--bad); box-shadow:0 0 14px var(--bad); animation:pulse 1.2s infinite; }
  @keyframes breathe { 50% { box-shadow:0 0 4px var(--ok); opacity:.75; } }
  @keyframes pulse { 50% { opacity:.3; } }
  .bar { height:6px; background:rgba(255,255,255,.10); border-radius:3px; overflow:hidden; margin-top:.6vh; }
  .bar i { display:block; height:100%; transition:width 1.5s ease; }
  footer { color:var(--muted); font-size:min(1.25vw,1.75vh); display:flex; justify-content:space-between; gap:2vw; }
  footer span { text-shadow:0 1px 6px rgba(0,0,0,.85); }
  .photo { max-width:45vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---- ambient (screen-saver) view: big clock that wanders, a line of status dots ---- */
  #amb .float { position:absolute; left:var(--ax,10%); top:var(--ay,20%); transition:opacity 1.6s ease; }
  #amb .float.hide { opacity:0; }
  .amb-clock { font-size:min(15vw,22vh); font-weight:200; line-height:.95; letter-spacing:-.03em; }
  .amb-date { font-size:min(2.6vw,3.6vh); color:#dfe5ee; margin-top:1vh; }
  .amb-line { display:flex; flex-wrap:wrap; gap:.9em 1.6em; margin-top:2.6vh; font-size:min(1.8vw,2.5vh); color:#dfe5ee; }
  .amb-line .it { display:flex; align-items:center; gap:.45em; }
  .amb-photo { margin-top:1.6vh; font-size:min(1.3vw,1.8vh); color:var(--muted); max-width:60vw; }
</style>
</head>
<body class="amb">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="warp" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.01 0.02" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap id="disp" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
<canvas id="fx"></canvas>
<div class="shade"></div>
<div id="flash"></div>
<div id="stage">
  <div class="view" id="dash">
    <header>
      <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
      <div class="overall"><div class="big" id="overall"><span class="dot"></span>Checking…</div><div class="small" id="updated"></div></div>
    </header>
    <div class="grid" id="grid"></div>
    <footer><span id="hostname"></span><span class="photo" id="photo"></span><span>Ctrl+Alt+Del → Switch user to use this PC</span></footer>
  </div>
  <div class="view" id="amb">
    <div class="float" id="float">
      <div class="amb-clock" id="aclock">--:--</div>
      <div class="amb-date" id="adate"></div>
      <div class="amb-line" id="aline"></div>
      <div class="amb-photo" id="aphoto"></div>
    </div>
  </div>
</div>
<div id="night"></div>
<script>
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const Q = new URLSearchParams(location.search);   // ?fx=rain|wind|fire|snow|fireflies  ?view=amb|dash (testing)
const DASH_MS = 100e3, AMB_MS = 260e3, NIGHT = [23, 6];   // view times; night hours (dimmer, calmer)
let last = null, lastOk = 0, ver = null, worst = 'ok', status = [], order = 0;

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ago(iso){ if(!iso) return '—'; let s=Math.max(0,(Date.now()-new Date(iso))/1000);
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  return d? `${d}d ${h}h` : h? `${h}h ${m}m` : `${m}m ${Math.floor(s%60)}s`; }
// Values with no spaces (addresses, accounts, paths) may break only after . / @ \ : - — never mid-word.
function val(v){ const s = String(v ?? ''), e = esc(s); return !/\s/.test(s) && s.length > 14 ? e.replace(/([./@\\:-])/g, '$1<wbr>') : e; }
// card(title, level, main, rows, {sub, pre, extra, cls}): sub = small text after the headline,
// pre = graphics between the headline and the rows, extra = anything after the rows.
function card(title, level, main, rows = [], o = {}){
  return {level, html:(i)=>`<section class="card ${level} ${o.cls||''}" style="--i:${i}"><h2>${esc(title)}</h2>
  <div class="main"><span class="dot"></span><span>${esc(main)}</span>${o.sub?`<small>${esc(o.sub)}</small>`:''}</div>${o.pre||''}
  ${rows.length?`<dl class="rows">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${val(v)}</dd>`).join('')}</dl>`:''}${o.extra||''}</section>`}; }
const lvl = (pct, warn, bad) => pct > bad ? 'bad' : pct > warn ? 'warn' : 'ok';
const col = l => `var(--${l})`;
function bar(pct, warn = 75, bad = 90){ pct = Math.max(0, Math.min(100, pct || 0));
  return `<div class="bar"><i style="width:${pct}%;background:${col(lvl(pct, warn, bad))}"></i></div>`; }
const short = v => { v = String(v ?? ''); return /^[0-9a-f]{12,}$/i.test(v) ? v.slice(0, 7) : v; };

/* ---------------- small graphics: rings, sparklines, status chips, icons ---------------- */
function ring(pct, label, warn = 75, bad = 90){
  pct = Math.max(0, Math.min(100, pct || 0));
  return `<div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" class="track"/>
    <circle cx="18" cy="18" r="15.5" pathLength="100" stroke="${col(lvl(pct, warn, bad))}" stroke-dasharray="${pct.toFixed(1)} 100"/></svg>
    <div class="lbl">${Math.round(pct)}%<small>${esc(label)}</small></div></div>`; }
// History of a few numbers (last 10 min at one poll per 10 s), recorded on each poll, drawn as sparklines.
const hist = {};
function track(k, v){ const a = hist[k] = hist[k] || []; if (v == null || isNaN(v)) return; a.push(+v); if (a.length > 60) a.shift(); }
// max = top of the scale (0 = fit to the data); level = colour of the line ('ok' / 'warn' / 'bad').
function spark(k, title, now, max, level){
  const a = hist[k] || []; if (!a.length) return '';
  const top = max || Math.max(300, ...a) * 1.2, c = col(level || 'ok');
  const pts = (a.length === 1 ? [a[0], a[0]] : a).map((v, i, arr) => `${(i / (arr.length - 1) * 100).toFixed(1)},${(22 - Math.min(1, v / top) * 19).toFixed(1)}`).join(' ');
  return `<div class="spk"><div class="spk-h"><span>${esc(title)}</span><b>${esc(now)}</b></div>
    <svg viewBox="0 0 100 24" preserveAspectRatio="none"><polygon points="0,24 ${pts} 100,24" fill="${c}" opacity=".16"/>
    <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg></div>`; }
const chips = list => `<div class="chips">${list.map(([t, l]) => `<span class="chip"><span class="dot ${l}"></span>${esc(t)}</span>`).join('')}</div>`;
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  globe:  svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9"/>'),
  server: svg('<rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/>'),
  worker: svg('<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>'),
  ai:     svg('<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>'),
};

/* ---------------- Jar card (from Jar's read-only /v1/monitor) ---------------- */
// A request's path as a flow diagram — internet → Funnel → Server → Worker → Ollama — then the details.
function jarCard(w){
  const m = w.monitor, nodes = [], info = [];
  let level = w.ok ? (w.ms > 3000 ? 'warn' : 'ok') : 'bad';
  const lines = v => (Array.isArray(v) ? v : [v]).filter(x => x !== '' && x != null && x !== false && x !== 0).map((x, i) => i ? `<small>${val(x)}</small>` : val(x)).join('<br>') || '—';
  const node = (name, icon, ok, v) => { nodes.push({name, icon, st: ok === null ? 'off' : ok ? 'ok' : 'bad', v});
                                         if (ok === false && level === 'ok') level = 'warn'; };
  const detail = (name, v, st) => info.push([(st !== undefined ? `<span class="dot ${st}"></span>` : '') + esc(name), lines(v)]);
  let main = w.ok ? 'Online' : 'Down', extra = '', pre = '';
  if (m) {
    const s = m.supervisor||{}, wk = m.worker||{}, ol = m.ollama||{}, fn = m.funnel||{}, ev = m.eval;
    if (fn.wanted !== undefined) node('Funnel', 'globe', fn.wanted ? !!fn.ok : null, fn.wanted ? (fn.ok ? 'Public' : (fn.problem||'Problem')) : 'Off');
    node('Server', 'server', true, m.app_version ? 'v' + m.app_version : 'Running');
    node('Worker', 'worker', !!wk.alive, wk.doing || (wk.alive ? 'Idle' : 'Not running'));
    node('Ollama', 'ai', !!ol.up, ol.up ? ((ol.loaded||[]).length ? ol.loaded.join(', ') : 'Idle') : 'Not reachable');
    if (!s.alive && level === 'ok') level = 'warn';
    detail('Supervisor', [short(s.code) || (s.alive ? 'Running' : 'Not running'), s.update && 'update waiting', s.restarts && `${s.restarts} restarts`], s.alive ? 'ok' : 'bad');
    const c = m.memos||{}, total = Object.values(c).reduce((a,b)=>a+b,0);
    detail('Memos', [`${total} recent`, ...Object.entries(c).filter(([k])=>!/^(done|filed|ok|processed)$/i.test(k)).map(([k,v])=>`${v} ${k}`)]);
    detail('Models', [wk.llm, wk.whisper].filter(Boolean).map(x => String(x).split('/').pop()));   // drop "org/" prefixes
    if (ev && ev.total) { const p = ev.passed / ev.total * 100;
      detail('AI test', [`${ev.passed}/${ev.total}${ev.passed === ev.total ? ' ✓' : ''}`, ev.model]);
      if (ev.passed !== ev.total && level === 'ok') level = 'warn';
      extra = `<div class="bar evbar"><i style="width:${p}%;background:${col(p === 100 ? 'ok' : p >= 90 ? 'warn' : 'bad')}"></i></div>`; }
    if (level === 'ok') main = 'All parts running';
    else if (w.ok) main = 'Running, with a problem';
    pre = `<div class="flow">${nodes.map((n, i) => (i ? `<i class="arrow ${n.st === 'ok' && nodes[i-1].st === 'ok' ? '' : 'off'}" style="--d:${i * .45}s"></i>` : '') +
      `<div class="node ${n.st}"><div class="ic">${ICON[n.icon]}</div><b>${esc(n.name)}</b><span>${val(n.v)}</span></div>`).join('')}</div>`;
  } else if (w.ok && w.monitorErr) { detail('Details', `Not available (${w.monitorErr})`); }
  else if (w.ok) { detail('Details', 'Add "monitorKey" in config.json to see every part'); }
  if (!w.ok) detail('Error', w.err || ('HTTP ' + w.code), 'bad');
  pre += `<div class="jar">${info.map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>${k.endsWith('AI test') ? extra : ''}</div>`).join('')}</div>`;
  return card(w.name || 'Jar', level, main, [], {sub: w.ok ? `${w.ms} ms` : '', pre, cls: 'wide'});
}

/* ---------------- render ---------------- */
function record(d){   // once per poll, so re-rendering the same data doesn't add points
  track('pc', d.host && d.host.cpu); track('vm', d.vm && d.vm.running ? d.vm.cpu : null);
  for (const w of (d.web||[])) track('web:' + w.name, w.ok ? w.ms : null);
}
function render(d){
  const cards=[]; status=[];
  const add = (c, label) => { cards.push(c); if (c.level) status.push({label, level:c.level}); };
  const ha=d.ha||{};
  const hl = ha.core==='running' && ha.health==='Healthy' ? 'ok' : ha.core==='running' ? 'warn' : ha.core==='starting' || ha.supervisor==='Connected' ? 'warn' : 'bad';
  const hm = ha.core==='running' ? (ha.health==='Healthy'?'Running':'Running · '+ha.health) : ha.core==='starting' ? 'Starting…' : ha.supervisor==='Connected' ? 'Core not up yet' : 'Not reachable';
  const st = (name, v, good) => [v === good ? name : `${name}: ${v || '—'}`, v === good ? 'ok' : v ? 'warn' : 'bad'];
  add(card('Home Assistant', hl, hm, [['Address', (ha.url||'').replace(/^https?:\/\//, '').replace(/\/$/, '')]],
    {pre: chips([st('Core', ha.core, 'running'), st('Supervisor', ha.supervisor, 'Connected'), st('Healthy', ha.health, 'Healthy')])}), 'Home Assistant');

  const vm=d.vm||{};
  add(card('HA virtual machine', vm.running?'ok':'bad', vm.running?'Running':'Stopped',
    [['Process', vm.process||'not running'], ['Memory', vm.running? (vm.memMB/1024).toFixed(1)+' GB'+(vm.allocMB?` / ${(vm.allocMB/1024).toFixed(1)} GB`:''):'—'],
     ['Up for', vm.started? ago(vm.started):'—']],
    {pre: vm.running ? spark('vm', 'CPU · 10 min', vm.cpu + ' %', 100, lvl(vm.cpu, 75, 90)) : ''}), 'VM');

  const as=d.autostart||{};
  // VirtualBox's Windows autostart service starts the VMs at boot and then exits, so "Stopped" is normal.
  const al = !as.installed || as.startType!=='Automatic' ? 'warn' : 'ok';
  add(card('VM autostart', al, !as.installed ? 'Not installed' : as.startType!=='Automatic' ? 'Not set to start at boot' : as.status==='Running' ? 'Starting VMs…' : 'Ready',
    as.installed ? [['Service now', as.status], ['Account', (as.name||'').replace(/^VirtualBox Autostart Service\s*/,'')]] : [['Effect','HA won’t start by itself after reboot']],
    {sub: al === 'ok' && as.status !== 'Running' ? 'for next boot' : '', pre: as.installed ? chips([['Starts at boot', as.startType === 'Automatic' ? 'ok' : 'warn']]) : ''}), 'Autostart');

  const h=d.host||{}; const memPct = h.memTotalGB? h.memUsedGB/h.memTotalGB*100 : 0;
  const diskPct = h.diskTotalGB ? (h.diskTotalGB - h.diskFreeGB) / h.diskTotalGB * 100 : 0, low = memPct>92 || (h.diskFreeGB!=null && h.diskFreeGB<10);
  add(card('This PC', low ? 'warn' : 'ok', low ? 'Low on resources' : 'Normal',
    [['Memory', `${h.memUsedGB} / ${h.memTotalGB} GB`], ['Disk free', `${h.diskFreeGB} GB`], ['Uptime', ago(h.boot)]],
    {pre: `<div class="rings">${ring(h.cpu, 'CPU')}${ring(memPct, 'RAM', 80, 92)}${ring(diskPct, 'Disk', 85, 92)}</div>` + spark('pc', 'CPU · 10 min', (h.cpu ?? '—') + ' %', 100, lvl(h.cpu, 75, 90))}), 'PC');

  const ts=d.tailscale||{};
  if(ts.installed) add(card('Tailscale', ts.state==='Running'?'ok':'warn', ts.state==='Running'?'Connected':ts.state, [['Tailnet IP', ts.ip||'—'], ['Devices online', ts.peers!=null?`${ts.peersOnline} / ${ts.peers}`:'—']]), 'Tailscale');

  for(const w of (d.web||[])){
    if (w.err==='not configured') { cards.push(card(w.name, '', 'Not set up', [['', 'Add its address in C:\\HA\\status\\config.json']])); continue; }
    if (w.kind==='jar') { add(jarCard(w), 'Jar'); continue; }
    let host=''; try{ host=new URL(w.url).host; }catch(e){}
    add(card(w.name, w.ok ? (w.ms>3000?'warn':'ok') : 'bad', w.ok ? 'Online' : 'Down',
      [['Via', 'Tailscale'], ['Address', host], ...(w.ok?[]:[['Error', w.err||('HTTP '+w.code)]])],
      {pre: spark('web:' + w.name, 'Response · 10 min', w.ok ? w.ms + ' ms' : '—', 0, !w.ok ? 'bad' : w.ms > 3000 ? 'warn' : 'ok')}), /tunnel|remote/i.test(w.name)?'Tunnel':w.name);
  }
  const mc=d.minecraft||[];
  if(!mc.length) cards.push(card('Minecraft', '', 'Not set up', [['', 'Add the server in C:\\HA\\status\\config.json']]));
  for(const s of mc) add(card('Minecraft · '+(s.name||s.host), s.online?'ok':'bad', s.online?`${s.players} / ${s.max} players`:'Offline',
      s.online? [['Version', s.version], ['Ping', s.ms+' ms'], ['Who', (s.who||[]).join(', ')||'—']] : [['Address', `${s.host}:${s.port}`], ['Error', s.err||'']],
      {pre: s.online && s.max ? bar(s.players / s.max * 100, 101, 101) : ''}), 'Minecraft');

  // Problems first; the rest rotate their places each time the dashboard comes back (burn-in).
  const rank = l => l==='bad'?0:l==='warn'?1:l?2:3;   // not-set-up cards go last
  const rot = cards.map((c,i)=>({c, k: rank(c.level)*100 + ((i + order) % cards.length)}));
  rot.sort((a,b)=>a.k-b.k);
  $('grid').innerHTML = rot.map((x,i)=>x.c.html(i)).join('');

  const levels = status.map(s=>s.level);
  worst = levels.includes('bad')?'bad':levels.includes('warn')?'warn':'ok';
  const msg = worst==='ok'?'All systems normal':worst==='warn'?'Needs attention':'Something is down';
  $('overall').innerHTML = `<span class="dot ${worst}"></span>${msg}`;
  $('aline').innerHTML = status.map(s=>`<span class="it"><span class="dot ${s.level}"></span>${esc(s.label)}</span>`).join('');
  $('hostname').textContent = (h.name || '') + (d.version ? ' · v ' + d.version : '');
  if (worst === 'bad' && document.body.classList.contains('amb')) showDash();
}

/* ---------------- views: dashboard ↔ ambient, wandering clock, pixel drift ---------------- */
let viewTimer = null, holdDash = 0, DASH_HOLD = false;
function showDash(){
  document.body.classList.remove('amb'); order++;
  if (last) render(last);
  const g = $('grid'); g.classList.add('enter'); setTimeout(()=>g.classList.remove('enter'), 2500);
  clearTimeout(viewTimer); viewTimer = setTimeout(showAmb, DASH_MS);
}
function showAmb(){
  if (!DASH_HOLD && (worst === 'bad' || Date.now() < holdDash)) { clearTimeout(viewTimer); viewTimer = setTimeout(showAmb, 30e3); return; }
  moveFloat(true); document.body.classList.add('amb');
  clearTimeout(viewTimer); viewTimer = setTimeout(showDash, AMB_MS);
}
function moveFloat(now){
  const f = $('float'), place = () => { f.style.setProperty('--ax', rnd(4, 46)+'%'); f.style.setProperty('--ay', rnd(6, 44)+'%'); };
  if (now) { place(); return; }
  f.classList.add('hide'); setTimeout(()=>{ place(); f.classList.remove('hide'); }, 1700);
}
setInterval(()=>{ if (document.body.classList.contains('amb')) moveFloat(false); }, 70e3);
function drift(){ $('stage').style.transform = `translate(${rnd(-14,14).toFixed(1)}px, ${rnd(-10,10).toFixed(1)}px)`; }
setInterval(drift, 30e3); drift();
['mousemove','keydown','touchstart'].forEach(e => addEventListener(e, () => { holdDash = Date.now() + 120e3; if (document.body.classList.contains('amb')) showDash(); }));
function isNight(){ const h = new Date().getHours(); return h >= NIGHT[0] || h < NIGHT[1]; }

/* ---------------- background photo with a distorted arrival ---------------- */
let bgId = null, bgFront = 'bgA';
function kenBurns(el){
  const s0 = rnd(1.0, 1.06), s1 = s0 + rnd(.05, .12), v = () => rnd(-2.5, 2.5).toFixed(2) + '%';
  el.style.setProperty('--s0', s0); el.style.setProperty('--s1', s1);
  ['--x0','--y0','--x1','--y1'].forEach(k => el.style.setProperty(k, v()));
  el.style.setProperty('--kbdur', rnd(60, 110).toFixed(0) + 's');
  el.classList.remove('kb'); void el.offsetWidth; el.classList.add('kb');
}
function setBg(b){
  if(!b || !b.id || b.id === bgId) return;
  const url = '/bg?id=' + encodeURIComponent(b.id), img = new Image();
  img.onload = () => {
    const first = bgId === null; bgId = b.id;
    const back = bgFront === 'bgA' ? 'bgB' : 'bgA';
    $(back).style.backgroundImage = `url("${url}")`; kenBurns($(back));
    if (!first) warp($(back), 3400, 160, 'arrive');
    $(back).classList.add('show'); $(bgFront).classList.remove('show'); bgFront = back;
    const cap = [b.title, b.copyright].filter(Boolean).join(' · ');
    $('photo').textContent = cap; $('aphoto').textContent = b.title || '';
    FX.choose();
  };
  img.src = url;
}
// Animated SVG displacement on one layer: 'arrive' melts the new photo into place, the others are short gusts.
let warping = false;
function warp(el, ms, peak, kind){
  if (warping) return; warping = true;
  const turb = $('turb'), disp = $('disp'), t0 = performance.now();
  const fr = { arrive:[.006,.012], rain:[.02,.07], wind:[.002,.04], fire:[.012,.05], snow:[.008,.01], fireflies:[.01,.01], none:[.01,.02] }[kind] || [.01,.02];
  turb.setAttribute('seed', Math.floor(rnd(1, 999)));
  el.style.filter = 'url(#warp)';
  const step = now => {
    const t = Math.min(1, (now - t0) / ms);
    const k = kind === 'arrive' ? Math.pow(1 - t, 2.2) : Math.sin(Math.PI * t);
    disp.setAttribute('scale', (peak * k).toFixed(1));
    turb.setAttribute('baseFrequency', `${(fr[0]*(1+.6*Math.sin(t*6))).toFixed(4)} ${(fr[1]*(1+.4*Math.cos(t*4))).toFixed(4)}`);
    if (t < 1) requestAnimationFrame(step); else { el.style.filter = ''; disp.setAttribute('scale', 0); warping = false; }
  };
  requestAnimationFrame(step);
}
(function gusts(){ setTimeout(() => { if (bgId) warp($(bgFront), rnd(3500, 6000), FX.mode==='wind'?34:FX.mode==='fire'?18:FX.mode==='rain'?22:14, FX.mode); gusts(); }, rnd(120e3, 300e3)); })();

/* ---------------- particle effects: rain, wind, fire, snow, fireflies ---------------- */
const FX = (() => {
  const cv = $('fx'), cx = cv.getContext('2d');
  let W = 0, H = 0, parts = [], mode = 'none', alpha = 0, target = 0, lastT = 0, flashA = 0, nextFlash = 0, glowT = 0;
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  addEventListener('resize', resize); resize();
  const sprite = (r, g, b) => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
    const gr = x.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(.35, `rgba(${r},${g},${b},.55)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr; x.fillRect(0,0,64,64); return c; };
  const S = { ember: sprite(255,150,60), hot: sprite(255,220,140), snow: sprite(255,255,255), fly: sprite(210,255,120) };
  const leafColors = ['#c9a227','#b5651d','#7a9a3a','#d2691e','#9c6b30'];
  const make = {
    rain: () => ({ x: rnd(-100, W), y: rnd(-H, 0), l: rnd(14, 34), v: rnd(900, 1500), w: rnd(.6, 1.6) }),
    wind: () => Math.random() < .75 ? { t:'s', x: rnd(-W, 0), y: rnd(0, H), l: rnd(80, 260), v: rnd(700, 1400), a: rnd(.05, .18) }
                                    : { t:'l', x: rnd(-W, 0), y: rnd(0, H), r: rnd(0, 6), vr: rnd(-4, 4), v: rnd(250, 520), s: rnd(5, 10), ph: rnd(0, 6), c: pick(leafColors) },
    fire: () => ({ x: rnd(0, W), y: H + rnd(0, 80), v: rnd(50, 160), s: rnd(4, 14), ph: rnd(0, 6), life: rnd(4, 10), age: 0, hot: Math.random() < .25 }),
    snow: () => ({ x: rnd(0, W), y: rnd(-H, 0), v: rnd(25, 80), s: rnd(2, 7), ph: rnd(0, 6), sw: rnd(10, 40) }),
    fireflies: () => ({ x: rnd(0, W), y: rnd(H*.25, H), vx: rnd(-20, 20), vy: rnd(-15, 15), s: rnd(8, 18), ph: rnd(0, 6), f: rnd(.5, 1.5) }),
  };
  const counts = { rain: 260, wind: 90, fire: 180, snow: 170, fireflies: 55, none: 0 };
  function set(m){
    mode = m; parts = []; const n = Math.round(counts[m] * (isNight() ? .5 : 1) * Math.min(1.4, W / 1600));
    for (let i = 0; i < n; i++) parts.push(make[m] ? make[m]() : null);
    alpha = 0; target = 1; nextFlash = performance.now() + rnd(30e3, 90e3);
  }
  function choose(){
    const night = isNight();
    const pool = night ? ['snow', 'fireflies', 'none'] : ['rain', 'wind', 'fire', 'snow', 'fireflies', 'rain', 'wind', 'fire'];
    let m; do { m = pick(pool); } while (m === mode && pool.length > 1);
    if (Q.get('fx')) m = Q.get('fx');
    target = 0; setTimeout(() => set(m), 2500);
  }
  function frame(now){
    requestAnimationFrame(frame);
    if (now - lastT < 33) return;                       // ~30 fps is plenty and keeps the PC cool
    const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
    alpha += (target - alpha) * Math.min(1, dt * 1.2);
    cx.clearRect(0, 0, W, H);
    if (mode === 'none' || alpha < .01) { $('flash').style.opacity = 0; return; }
    cx.globalAlpha = alpha;
    if (mode === 'rain') {
      cx.strokeStyle = 'rgba(200,215,255,.42)'; cx.lineCap = 'round';
      for (const p of parts) {
        p.y += p.v * dt; p.x += p.v * .18 * dt;
        cx.lineWidth = p.w; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.l * .18, p.y - p.l); cx.stroke();
        if (p.y > H) { cx.beginPath(); cx.ellipse(p.x, H - 2, 6 * p.w, 1.5, 0, 0, Math.PI * 2); cx.stroke(); Object.assign(p, make.rain(), { y: rnd(-60, 0) }); }
      }
      if (!isNight() && now > nextFlash) { flashA = .35; nextFlash = now + rnd(40e3, 140e3); if (Math.random() < .6) setTimeout(()=>{ flashA = .25; }, 160); }
      flashA *= Math.pow(.02, dt); $('flash').style.opacity = (flashA * alpha).toFixed(3);
    } else if (mode === 'wind') {
      for (const p of parts) {
        p.x += p.v * dt;
        if (p.t === 's') {
          const g = cx.createLinearGradient(p.x - p.l, 0, p.x, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,255,${p.a})`);
          cx.strokeStyle = g; cx.lineWidth = 1.2; cx.beginPath(); cx.moveTo(p.x - p.l, p.y); cx.quadraticCurveTo(p.x - p.l/2, p.y - 6, p.x, p.y); cx.stroke();
        } else {
          p.ph += dt * 3; p.y += Math.sin(p.ph) * 40 * dt; p.r += p.vr * dt;
          cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.scale(1, Math.abs(Math.sin(p.ph)) * .7 + .3);
          cx.fillStyle = p.c; cx.beginPath(); cx.ellipse(0, 0, p.s, p.s * .45, 0, 0, Math.PI * 2); cx.fill(); cx.restore();
        }
        if (p.x - (p.l || 20) > W) Object.assign(p, make.wind(), { x: rnd(-300, -20) });
      }
    } else if (mode === 'fire') {
      glowT += dt; const fl = .55 + .25 * Math.sin(glowT * 7.3) * Math.sin(glowT * 3.1) + .1 * Math.random();
      const g = cx.createLinearGradient(0, H, 0, H * .55); g.addColorStop(0, `rgba(255,90,20,${.32 * fl})`); g.addColorStop(1, 'rgba(255,90,20,0)');
      cx.fillStyle = g; cx.fillRect(0, H * .55, W, H * .45);
      cx.globalCompositeOperation = 'lighter';
      for (const p of parts) {
        p.age += dt; p.y -= p.v * dt; p.ph += dt * 2; p.x += Math.sin(p.ph) * 18 * dt + 12 * dt;
        const life = 1 - p.age / p.life, s = p.s * (.6 + .4 * life);
        cx.globalAlpha = alpha * Math.max(0, life) * (.6 + .4 * Math.random());
        cx.drawImage(p.hot ? S.hot : S.ember, p.x - s * 2, p.y - s * 2, s * 4, s * 4);
        if (life <= 0 || p.y < -20) Object.assign(p, make.fire());
      }
      cx.globalCompositeOperation = 'source-over';
    } else if (mode === 'snow') {
      for (const p of parts) {
        p.ph += dt; p.y += p.v * dt; const x = p.x + Math.sin(p.ph) * p.sw;
        cx.globalAlpha = alpha * .85; cx.drawImage(S.snow, x - p.s, p.y - p.s, p.s * 2, p.s * 2);
        if (p.y > H + 10) Object.assign(p, make.snow(), { y: -10 });
      }
    } else if (mode === 'fireflies') {
      cx.globalCompositeOperation = 'lighter';
      for (const p of parts) {
        p.ph += dt * p.f; p.vx += rnd(-30, 30) * dt; p.vy += rnd(-30, 30) * dt; p.vx *= .98; p.vy *= .98;
        p.x = (p.x + p.vx * dt + W) % W; p.y = Math.min(H, Math.max(H * .15, p.y + p.vy * dt));
        const b = Math.max(0, Math.sin(p.ph * 2)); cx.globalAlpha = alpha * b;
        cx.drawImage(S.fly, p.x - p.s, p.y - p.s, p.s * 2, p.s * 2);
      }
      cx.globalCompositeOperation = 'source-over';
    }
    cx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
  setInterval(choose, 12 * 60e3);
  return { choose, get mode(){ return mode; } };
})();

/* ---------------- data + clock ---------------- */
async function poll(){
  try { const r = await fetch('/api',{cache:'no-store'}); last = await r.json(); lastOk = Date.now();
    if (ver && last.version && last.version !== ver) { location.reload(); return; }
    ver = last.version || ver; record(last); render(last); setBg(last.bg); }
  catch(e){ $('overall').innerHTML = '<span class="dot bad"></span>Status service not responding'; worst = 'bad';
            $('aline').innerHTML = '<span class="it"><span class="dot bad"></span>Status service not responding</span>'; }
}
function tick(){ const n = new Date();
  const t = n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), dd = n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('clock').textContent = $('aclock').textContent = t; $('date').textContent = $('adate').textContent = dd;
  if (lastOk) $('updated').textContent = 'Updated ' + Math.round((Date.now() - lastOk) / 1000) + ' s ago';
  document.body.classList.toggle('night', isNight());
}
poll(); setInterval(poll, 10000); tick(); setInterval(tick, 1000);
if (Q.get('view') === 'amb') { DASH_HOLD = true; showAmb(); } else showDash();
setTimeout(() => { if (FX.mode === 'none') FX.choose(); }, 4000);
</script>
